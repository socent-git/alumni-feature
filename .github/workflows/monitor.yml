name: Organisation updates

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days at 03:17 UTC (08:47 IST)
  workflow_dispatch:
    inputs:
      days:
        description: "Look-back window in days"
        default: "7"

permissions:
  contents: write

concurrency:
  group: org-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check organisations and post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python monitor.py --days "${{ github.event.inputs.days || '7' }}"

      - name: Save what was seen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json data/updates.csv
          git diff --cached --quiet || git commit -m "Update seen items ($(date -u +%F))"
          git push
